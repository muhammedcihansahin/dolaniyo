# main dalına her push'ta oyunu derleyip GitHub Pages'te yayınlar (ücretsiz, sürekli açık):
# https://muhammedcihansahin.github.io/dolaniyo/
# Bir kez gerekli: depo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Pull request'lerde yalnızca test edip derler, yayınlamaz.
name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Aynı anda tek yayın; yarım kalan yayın iptal edilmesin
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # İsteğe bağlı güvenilir aktarıcı (TURN) — depo Settings → Secrets and variables →
          # Actions → Variables: TURN_URL (kimlik bilgisi adresi), ICE_SERVERS (RTCIceServer[] JSON)
          VITE_TURN_URL: ${{ vars.TURN_URL }}
          VITE_ICE_SERVERS: ${{ vars.ICE_SERVERS }}

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: packages/client/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
